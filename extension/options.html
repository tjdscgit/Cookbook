<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cookbook Clipper — Options</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 480px; margin: 30px auto; }
    label { display: block; margin-bottom: 14px; }
    .lbl { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    input {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--paper); color: var(--ink); font: inherit;
    }
    .hint { display: block; font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
  </style>
</head>
<body>
  <h1><span class="mark"></span> Cookbook Clipper — Options</h1>

  <label>
    <span class="lbl">Firebase project id</span>
    <input type="text" id="project" placeholder="my-cookbook" autocomplete="off" spellcheck="false">
    <span class="hint">Same project id you use in the main Cookbook app.</span>
  </label>

  <label>
    <span class="lbl">Firebase web API key</span>
    <input type="text" id="apiKey" placeholder="AIza…" autocomplete="off" spellcheck="false">
    <span class="hint">Not a secret — it identifies the project and grants nothing by itself. Access comes from signing in below.</span>
  </label>

  <label>
    <span class="lbl">Email</span>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="username" spellcheck="false">
  </label>

  <label>
    <span class="lbl">Password</span>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <span class="hint">Never stored — it's exchanged once for a token kept in this extension's own storage.</span>
  </label>

  <label>
    <span class="lbl">Anthropic API key <span style="font-weight:400;color:var(--ink-faint)">(optional)</span></span>
    <input type="password" id="key" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
    <span class="hint">Only used when a page has no machine-readable recipe data. Sent browser-direct to Anthropic, never through anything else.</span>
  </label>

  <button class="btn primary" id="btnSave">Save</button>
  <div class="status" id="status"></div>

  <script src="lib/cookbook-units.js"></script>
  <script src="lib/cookbook-data.js"></script>
  <script src="options.js"></script>
</body>
</html>
